# SPDX-License-Identifier: GPL-3.0-or-later
name: Release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux64
          - os: ubuntu-22.04
            target: steamdeck
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Public-source checks
        run: python3 tools/check_release_docs.py
      - name: Build, test and package
        run: python3 tools/build_release.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: build/dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - run: python tools/build_release.py --target win64
      - uses: actions/upload-artifact@v4
        with:
          name: win64
          path: build/dist/*
          if-no-files-found: error
  quest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.REMINISCENCE2_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quest-release.p12"
          chmod 600 "$RUNNER_TEMP/quest-release.p12"
      - name: Signed flat-panel APK
        env:
          REMINISCENCE2_KEYSTORE: ${{ runner.temp }}/quest-release.p12
          REMINISCENCE2_STORE_PASSWORD: ${{ secrets.REMINISCENCE2_STORE_PASSWORD }}
          REMINISCENCE2_KEY_PASSWORD: ${{ secrets.REMINISCENCE2_KEY_PASSWORD }}
          REMINISCENCE2_KEY_ALIAS: reminiscence2
        run: python3 tools/build_release.py --target quest
      - name: Verify APK signature and contents
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 build/dist/*.apk
          unzip -l build/dist/*.apk | tee build/apk-contents.txt
          test "$(unzip -Z1 build/dist/*.apk | grep '^lib/' | grep -v '^lib/arm64-v8a/' | wc -l)" -eq 0
          test "$(unzip -Z1 build/dist/*.apk | grep '^lib/arm64-v8a/.*\.so$' | wc -l)" -ge 2
      - uses: actions/upload-artifact@v4
        with:
          name: quest-arm64
          path: build/dist/*
          if-no-files-found: error
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_release_docs.py
      - run: python3 -m unittest discover -s tests -p test_release_tools.py -v
      - run: python3 tools/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          path: build/dist/*
          if-no-files-found: error
